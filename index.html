<!DOCTYPE html>
<html lang="it"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PharmakoS — Foto &amp; Video · Napoli</title>
<meta name="description" content="Massimo Esposito — fotografo e videomaker a Napoli. Contenuti ADV, video, fotografia, montaggio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d0c;--bg2:color-mix(in srgb,var(--bg) 92%,#fff);--ink:#f1efe8;--mute:#8b8f88;--line:#232825;--acid:#c8ff3e;--hot:#ff5a36}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;width:100%;height:100%;object-fit:cover}
a{color:inherit;text-decoration:none}
::selection{background:var(--acid);color:var(--bg)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.d{font-family:Syne,system-ui,sans-serif;font-weight:800;letter-spacing:-.04em;line-height:.86;text-transform:uppercase}
.acid{color:var(--acid)}
section{position:relative}

/* ===== INTRO: diaframma che si apre ===== */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;pointer-events:none}
#intro svg{position:absolute;width:300vmax;height:300vmax;left:50%;top:50%;transform:translate(-50%,-50%)}
#intro .bl{fill:var(--bg2);stroke:#1c201d;stroke-width:.3;transform-origin:50px 50px;transition:transform 1.3s cubic-bezier(.75,0,.15,1)}
#intro.open .bl{transform:rotate(var(--r)) translate(var(--tx),var(--ty))}
#intro .cnt{position:relative;z-index:2;text-align:center;transition:opacity .4s}
#intro.open .cnt{opacity:0}
#intro .cnt b{display:block;font:800 clamp(56px,12vw,120px)/1 Syne;color:var(--acid)}

/* ===== NAV ===== */
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(16px,3vw,36px);mix-blend-mode:difference}
nav .logo{font:800 18px Syne;letter-spacing:-.02em}
nav .logo i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--acid);margin-left:4px;animation:blink 1.2s steps(1) infinite}
nav .links{display:flex;gap:clamp(14px,2.4vw,30px)}
nav .links a{position:relative;overflow:hidden;display:inline-block;height:1.3em}
nav .links a span{display:block;transition:transform .45s cubic-bezier(.7,0,.2,1)}
nav .links a span+span{position:absolute;top:100%;left:0;color:var(--acid)}
nav .links a:hover span{transform:translateY(-100%)}
@keyframes blink{50%{opacity:0}}

/* ===== HERO ===== */
.hero{height:100svh;min-height:560px;overflow:hidden;display:grid;place-items:center}
.cols{position:absolute;inset:-10% -5%;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;transform:rotate(-8deg) scale(1.15);opacity:.42}
.col{display:flex;flex-direction:column;gap:12px;animation:up var(--d,40s) linear infinite}
.col:nth-child(even){animation-name:down}
.col figure{aspect-ratio:3/4;border-radius:10px;overflow:hidden;flex:none;background:#1a1d1b}
@keyframes up{to{transform:translateY(-50%)}}
@keyframes down{from{transform:translateY(-50%)}to{transform:translateY(0)}}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(11,13,12,.35),rgba(11,13,12,.92) 70%);pointer-events:none}
.ht{position:relative;z-index:2;text-align:center;padding:0 4vw}
.ht .who{display:inline-flex;gap:10px;align-items:center;margin-bottom:3vh;color:var(--acid)}
.ht .who i{width:8px;height:8px;border-radius:50%;background:var(--hot);animation:blink 1s steps(1) infinite}
.name{font-size:clamp(48px,14vw,230px);display:flex;justify-content:center;white-space:nowrap}
.name span{display:inline-block;transform:translateY(110%) rotate(8deg);opacity:0;transition:transform 1.1s cubic-bezier(.2,.9,.2,1),opacity .6s}
.go .name span{transform:none;opacity:1}
.name .s{color:var(--acid)}
.sub{margin-top:3vh;display:flex;gap:clamp(10px,2vw,26px);justify-content:center;flex-wrap:wrap;opacity:0;transform:translateY(14px);transition:1s .9s}
.go .sub{opacity:1;transform:none}
.sub span{border:1px solid var(--line);padding:9px 14px;border-radius:999px;background:rgba(11,13,12,.5);backdrop-filter:blur(6px)}
.hud{position:absolute;inset:auto clamp(16px,3vw,36px) 22px;display:flex;justify-content:space-between;align-items:flex-end;z-index:2;color:var(--mute)}
.cue{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink)}
.cue i{width:1px;height:46px;background:linear-gradient(var(--acid),transparent);animation:cue 1.8s ease-in-out infinite;transform-origin:top}
@keyframes cue{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

/* ===== INTESTAZIONI ===== */
.wrap{padding:clamp(90px,16vh,170px) clamp(16px,4vw,56px)}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:clamp(36px,7vh,70px);flex-wrap:wrap}
.hd h2{font-size:clamp(46px,9vw,150px)}
.hd h2 em{font-style:normal;-webkit-text-stroke:1.5px var(--ink);color:transparent}
.hd p{max-width:34ch;color:var(--mute);line-height:1.5}
.kick{display:block;color:var(--acid);margin-bottom:14px}

/* comparsa delle parole */
.rv{opacity:0;transform:translateY(40px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.wipe{clip-path:inset(100% 0 0 0);transition:clip-path 1.1s cubic-bezier(.7,0,.2,1)}
.wipe.in{clip-path:inset(0)}

/* ===== VIDEO / LAVORI: binario orizzontale ===== */
.work{background:var(--bg2)}
.track{display:flex;gap:clamp(14px,2vw,28px);overflow-x:auto;scroll-snap-type:x mandatory;padding:0 clamp(16px,4vw,56px) 10px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 clamp(270px,38vw,560px);scroll-snap-align:start;cursor:pointer}
.card .m{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#1a1d1b}
.card .m img{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.card:hover .m img{transform:scale(1.07)}
.card .tc{position:absolute;left:12px;top:12px;background:rgba(11,13,12,.7);padding:6px 9px;border-radius:6px}
.card .tc b{color:var(--hot);font-weight:500}
.card .pl{position:absolute;right:14px;bottom:14px;width:58px;height:58px;border-radius:50%;background:var(--acid);display:grid;place-items:center;transform:scale(.7) rotate(-90deg);opacity:0;transition:.5s cubic-bezier(.3,1.5,.5,1)}
.card:hover .pl{transform:none;opacity:1}
.card .meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;gap:10px}
.card h3{font:700 clamp(22px,2.4vw,34px)/1 Syne;letter-spacing:-.02em;text-transform:uppercase}
.card .meta .mono{color:var(--mute);white-space:nowrap}
.bar{margin:28px clamp(16px,4vw,56px) 0;height:2px;background:var(--line);position:relative;overflow:hidden;border-radius:2px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:20%;background:var(--acid);transition:transform .2s}
.arrows{display:flex;gap:10px}
.arrows button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:18px;cursor:pointer;transition:.3s}
.arrows button:hover{background:var(--acid);color:var(--bg);border-color:var(--acid)}

/* ===== FOTO ===== */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.filters button{border:1px solid var(--line);background:none;color:var(--ink);padding:10px 16px;border-radius:999px;cursor:pointer;font:500 12px "JetBrains Mono";letter-spacing:.1em;text-transform:uppercase;transition:.3s}
.filters button.on{background:var(--acid);color:var(--bg);border-color:var(--acid)}
.mason{columns:3 260px;column-gap:clamp(10px,1.4vw,18px)}
.ph{break-inside:avoid;margin-bottom:clamp(10px,1.4vw,18px);position:relative;border-radius:12px;overflow:hidden;cursor:zoom-in;background:#1a1d1b}
.ph img{height:auto;transition:transform 1.4s cubic-bezier(.2,.8,.2,1),filter .6s;transform:scale(1.15)}
.ph.in img{transform:scale(1)}
.ph:hover img{transform:scale(1.05)}
.ph .lab{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.7));display:flex;justify-content:space-between;transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.ph:hover .lab{transform:none}
.ph .lab b{font:700 18px Syne;text-transform:uppercase}
.ph.hid{display:none}

/* ===== SHOWREEL ===== */
.reel{padding:0 clamp(16px,4vw,56px) clamp(90px,16vh,170px)}
.screen{position:relative;aspect-ratio:16/9;max-height:84vh;width:100%;border-radius:18px;overflow:hidden;cursor:pointer;background:#000}
.screen img{transition:transform 1.5s cubic-bezier(.2,.8,.2,1),filter .8s;filter:saturate(.7) brightness(.6)}
.screen:hover img{transform:scale(1.04);filter:saturate(1) brightness(.75)}
.screen .big{position:absolute;inset:0;display:grid;place-items:center}
.screen .big span{font-size:clamp(60px,14vw,230px);mix-blend-mode:overlay;color:#fff}
.screen .btn{position:absolute;left:50%;top:50%;width:clamp(90px,10vw,140px);aspect-ratio:1;margin:calc(clamp(90px,10vw,140px)/-2);border-radius:50%;background:var(--acid);color:var(--bg);display:grid;place-items:center;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.screen:hover .btn{transform:scale(1.12)}
.screen .btn svg.ring{position:absolute;inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.screen .corner{position:absolute;width:30px;height:30px;border:2px solid var(--acid)}
.screen .c1{left:18px;top:18px;border-right:0;border-bottom:0}.screen .c2{right:18px;top:18px;border-left:0;border-bottom:0}
.screen .c3{left:18px;bottom:18px;border-right:0;border-top:0}.screen .c4{right:18px;bottom:18px;border-left:0;border-top:0}
.screen .rec{position:absolute;left:58px;top:22px;color:#fff}.screen .rec b{color:var(--hot);animation:blink 1s steps(1) infinite}

/* ===== SERVIZI ===== */
.svc{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:60px 1fr 1fr 40px;gap:20px;align-items:center;padding:clamp(20px,3.4vh,34px) 0;border-bottom:1px solid var(--line);position:relative;overflow:hidden;cursor:default}
.row::before{content:"";position:absolute;inset:0;background:var(--acid);transform:translateY(101%);transition:transform .55s cubic-bezier(.7,0,.2,1);z-index:0}
.row:hover::before{transform:none}
.row>*{position:relative;z-index:1;transition:color .3s}
.row:hover>*{color:var(--bg)}
.row h3{font:800 clamp(30px,5vw,78px)/.9 Syne;text-transform:uppercase;letter-spacing:-.03em}
.row p{color:var(--mute);line-height:1.5;max-width:40ch}
.row .ar{font-size:26px;transition:transform .5s}
.row:hover .ar{transform:rotate(-45deg)}

/* ===== ABOUT ===== */
.about{display:grid;grid-template-columns:minmax(220px,420px) 1fr;gap:clamp(30px,6vw,90px);align-items:center}
.pic{position:relative;aspect-ratio:4/5;border-radius:220px 220px 16px 16px;overflow:hidden}
.pic img{filter:grayscale(1) contrast(1.1)}
.stamp{position:absolute;right:-18px;top:-18px;width:120px;height:120px;z-index:2}
.stamp svg{animation:spin 18s linear infinite}
.about .q{font:700 clamp(28px,3.6vw,56px)/1.05 Syne;letter-spacing:-.02em;margin-bottom:24px}
.about .q em{font-style:normal;color:var(--acid)}
.about p{color:var(--mute);line-height:1.7;max-width:56ch}
.facts{display:flex;gap:clamp(20px,4vw,50px);margin-top:30px;flex-wrap:wrap}
.facts div{border-left:2px solid var(--acid);padding-left:14px}
.facts b{display:block;font:800 clamp(34px,4vw,56px)/1 Syne}

/* ===== CONTATTI ===== */
.contact{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:16vh 4vw 6vh;overflow:hidden}
.contact h2{font-size:clamp(52px,14vw,230px);white-space:nowrap}
.contact h2 .o{display:inline-block;width:.78em;height:.78em;border-radius:50%;background:var(--acid);vertical-align:-.05em;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.82)}}
.mag{margin-top:6vh;display:inline-flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:20px 30px;border-radius:999px;font:700 clamp(16px,1.8vw,22px) Syne;transition:background .3s;will-change:transform}
.mag:hover{background:var(--acid)}
.mail{margin-top:3vh;color:var(--mute);word-break:break-all}
.soc{display:flex;gap:12px;margin-top:5vh;flex-wrap:wrap;justify-content:center}
.soc a{border:1px solid var(--line);padding:12px 20px;border-radius:999px;transition:.3s}
.soc a:hover{border-color:var(--acid);color:var(--acid)}
footer{display:flex;justify-content:space-between;width:100%;margin-top:12vh;color:var(--mute);flex-wrap:wrap;gap:10px}

/* ===== LIGHTBOX + CURSORE ===== */
#lb{position:fixed;inset:0;z-index:90;background:rgba(6,7,6,.94);display:grid;place-items:center;opacity:0;visibility:hidden;transition:.4s}
#lb.on{opacity:1;visibility:visible}
#lb img{max-width:92vw;max-height:84vh;width:auto;height:auto;border-radius:10px;transform:scale(.94);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#lb.on img{transform:none}
#lb .x{position:absolute;top:18px;right:22px;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:22px;cursor:pointer}
#lb .nv{position:absolute;top:50%;width:52px;height:52px;margin-top:-26px;border-radius:50%;border:0;background:var(--acid);color:var(--bg);font-size:20px;cursor:pointer}
#lb .pv{left:18px}#lb .nx{right:18px}
#lb .cap{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:var(--mute)}
#cur{position:fixed;left:0;top:0;width:12px;height:12px;border-radius:50%;background:var(--acid);z-index:95;pointer-events:none;transform:translate(-50%,-50%);transition:width .3s,height .3s;display:grid;place-items:center;color:var(--bg);font:500 10px "JetBrains Mono";letter-spacing:.1em;mix-blend-mode:difference}
#cur.big{width:80px;height:80px;mix-blend-mode:normal}
@media(hover:none){#cur{display:none}}
#prog{position:fixed;left:0;top:0;height:2px;width:100%;background:var(--acid);transform-origin:0 0;transform:scaleX(0);z-index:60}

@media(max-width:760px){
  nav .links a:not(.k){display:none}
  .cols{grid-template-columns:repeat(3,1fr);inset:-10% -20%}
  .col:nth-child(n+4){display:none}
  .row{grid-template-columns:36px 1fr 30px}.row p{display:none}
  .about{grid-template-columns:1fr}.pic{max-width:340px}
  .card{flex-basis:80vw}
  .mason{columns:2}
  .ph .lab{transform:none;padding:24px 10px 8px}.ph .lab b{font-size:14px}
  .arrows{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.wipe{opacity:1;transform:none;clip-path:none}}

/* ===== EDITOR ===== */
.ph0{width:100%;height:100%;background:linear-gradient(135deg,#1d221f,#2c332e)}
.tl,.x1,.edonly{display:none!important}
body.editing .edonly{display:block!important}body.editing .x1{display:inline-grid!important}
body.editing .tl{display:flex!important;position:absolute;top:8px;right:8px;z-index:6;gap:4px}
.tl button,.x1{border:0;background:var(--bg);color:var(--ink);width:32px;height:32px;border-radius:8px;cursor:pointer;font:600 14px Inter;place-items:center}
.tl button.r,.x1{background:var(--hot);color:#fff}.x1{width:20px;height:20px;border-radius:50%;margin-left:6px;font-size:12px}
.row .tl{position:static!important}body.editing .row{grid-template-columns:60px 1fr 1fr 40px auto}
.addw{padding:20px clamp(16px,4vw,56px) 0}
.addb{border:2px dashed var(--acid);background:none;color:var(--acid);padding:18px;border-radius:12px;width:100%;cursor:pointer;font:500 12px "JetBrains Mono";letter-spacing:.1em;text-transform:uppercase}
.addb.sm{width:auto;padding:8px 14px;border-radius:999px}
body.editing [contenteditable]{outline:1px dashed var(--acid);outline-offset:3px;cursor:text}
body.editing [contenteditable]:focus{outline:2px solid var(--acid)}
body.editing [contenteditable]:empty{display:inline-block;min-width:50px;min-height:1em}
body.editing [contenteditable]:empty::before{content:"(vuoto)";opacity:.5;font:italic 12px Inter;text-transform:none}
body:not(.editing) [data-k]:empty,body:not(.editing) [data-p]:empty{display:none}
body.editing [data-img],body.editing [data-li]{outline:2px dashed var(--hot);outline-offset:-2px;cursor:pointer}
body.editing #intro{display:none}body.editing .ph .lab{transform:none}
body.editing .hero .ht,body.editing .rv,body.editing .wipe{opacity:1;transform:none;clip-path:none}
#eb{position:fixed;right:16px;bottom:16px;z-index:120;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#eb[hidden]{display:none}
#eb button{border:0;padding:12px 16px;border-radius:999px;cursor:pointer;font:600 13px Inter;background:var(--ink);color:var(--bg);box-shadow:0 6px 20px rgba(0,0,0,.4)}
#eb .s{display:none}body.editing #eb .s{display:inline-block}
#eb .p{background:var(--acid)}#eb .g{background:#19b36b;color:#fff}
#dlg{position:fixed;inset:0;z-index:130;background:rgba(0,0,0,.6);display:none;place-items:center;font-family:Inter}
#dlg.on{display:grid}
#dlg .dp{background:#f1efe8;color:#111;border-radius:16px;padding:22px;width:min(92vw,440px);display:flex;flex-direction:column;gap:12px;border-top:6px solid var(--acid)}
#dlg h4{font:800 22px Syne;text-transform:uppercase}
#dlg label{display:block;font-size:13px;color:#555}
#dlg label.c{display:flex;justify-content:space-between;align-items:center}
#dlg input[type=text],#dlg select{width:100%;padding:10px;border:1px solid #bbb;border-radius:8px;margin-top:4px;font-size:14px;background:#fff}
#dlg input[type=file]{margin-top:6px;width:100%}
#dlg .dr{display:flex;justify-content:flex-end;gap:8px}#dlg .dr button{border:0;padding:10px 16px;border-radius:999px;font-weight:600;cursor:pointer;background:#ddd}
#dlg .dr .p{background:var(--acid)}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;z-index:140;font:500 13px Inter;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
#lb .vbox{display:none;width:min(92vw,1200px);aspect-ratio:16/9;max-height:84vh}
#lb.vid .vbox{display:block}#lb.vid img,#lb.vid .nv{display:none}
#lb .vbox iframe{width:100%;height:100%;border:0;border-radius:10px}
.sub span{display:inline-flex;align-items:center}.sub b{font-weight:400}
.facts div{position:relative}
</style>
</head>
<body>
<div id="prog"></div>
<div id="cur"></div>

<div id="intro">
  <svg viewBox="0 0 100 100" id="iris"></svg>
  <div class="cnt"><b id="ic">f/1.4</b><span class="mono" data-k="introTxt"></span></div>
</div>

<nav class="mono">
  <a href="#top" class="logo"><span data-k="brand"></span><i></i></a>
  <div class="links"><a href="#lavori"><span data-k="n1"></span><span data-k="n1"></span></a><a href="#foto"><span data-k="n2"></span><span data-k="n2"></span></a><a href="#servizi"><span data-k="n3"></span><span data-k="n3"></span></a><a href="#contatti" class="k"><span data-k="n4"></span><span data-k="n4"></span></a></div>
</nav>

<section class="hero" id="top">
  <div class="cols" id="cols"></div>
  <div class="ht">
    <span class="who mono"><i></i><span data-k="who"></span></span>
    <h1 class="name d" id="name"></h1>
    <div class="sub mono" id="tags"></div>
  </div>
  <div class="hud mono"><span id="tc">00:00:00:00</span><a href="#lavori" class="cue"><i></i><span data-k="cue"></span></a><span data-k="hud"></span></div>
</section>

<section class="work" id="lavori">
  <div class="wrap" style="padding-bottom:40px">
    <div class="hd"><div><span class="kick mono rv" data-k="k1"></span><h2 class="d wipe"><span data-k="h1a"></span> <em data-k="h1b"></em></h2></div>
      <div class="arrows"><button id="prev" aria-label="Indietro">←</button><button id="next" aria-label="Avanti">→</button></div></div>
  </div>
  <div class="track" id="track"></div>
  <div class="bar"><i id="barI"></i></div>
  <div class="edonly addw"><button class="addb" data-act="addVideo">+ Aggiungi video</button></div>
  <div style="height:clamp(70px,12vh,130px)"></div>

const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add("in");e.target.querySelectorAll(".wipe").forEach(w=>w.classList.add("in"));io.unobserve(e.target);
  if(e.target.id==="facts"&&!ED())$$(".cnt").forEach(b=>{const n=parseFloat(b.dataset.n);if(isNaN(n))return;const s=performance.now();(function f(t){const p=Math.min((t-s)/1400,1);b.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f);else b.textContent=b.dataset.n})(s)})}),{threshold:.15,rootMargin:"0px 0px -5% 0px"});
const prog=$("#prog");let tk=false;
addEventListener("scroll",()=>{if(tk)return;tk=true;requestAnimationFrame(()=>{tk=false;const y=scrollY;prog.style.transform=`scaleX(${y/(document.documentElement.scrollHeight-innerHeight)})`;
  if(y<innerHeight)$("#cols").style.transform=`rotate(-8deg) scale(${1.15+y/innerHeight*.15}) translateY(${y*.15}px)`})},{passive:true});
if(matchMedia("(hover:hover)").matches){const cu=$("#cur");let mx=0,my=0,cx=0,cy=0;
  addEventListener("mousemove",e=>{mx=e.clientX;my=e.clientY});
  (function loop(){cx+=(mx-cx)*.2;cy+=(my-cy)*.2;cu.style.transform=`translate(${cx-cu.offsetWidth/2}px,${cy-cu.offsetHeight/2}px)`;requestAnimationFrame(loop)})();
  document.addEventListener("mouseover",e=>{const t=!ED()&&e.target.closest(".card,.ph,#screen");cu.classList.toggle("big",!!t);cu.textContent=t?(t.classList.contains("ph")?"VEDI":"PLAY"):""});
  const mg=$("#mag");mg.addEventListener("mousemove",e=>{const r=mg.getBoundingClientRect();mg.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.25}px,${(e.clientY-r.top-r.height/2)*.35}px)`});
  mg.addEventListener("mouseleave",()=>mg.style.transform="")}
setInterval(()=>{try{$("#clock").textContent="Napoli "+new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})}catch(e){}},1000);

renderAll();
$$(".rv,#facts").forEach(el=>io.observe(el));$$(".wipe").forEach(w=>io.observe(w.parentElement));

/* ===================================================================
   EDITOR — Cmd/Ctrl + Shift + E per mostrare i pulsanti
   =================================================================== */
const eb=$("#eb"),eT=$("#eT");
if(location.hash==="#modifica")eb.hidden=false;
addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.shiftKey&&e.key.toLowerCase()==="e"){e.preventDefault();eb.hidden=!eb.hidden;if(eb.hidden&&ED())toggle()}});
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2600)};
function editable(on){$$("[data-k],[data-p]").forEach(el=>{if(el.closest("nav .links span+span"))return;on?el.setAttribute("contenteditable","plaintext-only"):el.removeAttribute("contenteditable")})}
function toggle(){const on=!ED();document.body.classList.toggle("editing",on);eT.textContent=on?"✓ Fine":"✎ Modifica";editable(on);
  if(on){$$(".rv,.wipe,.ph").forEach(x=>x.classList.add("in"));commit();toast("Clicca testi, foto e pulsanti per modificarli")}else renderAll()}
eT.onclick=toggle;
const rd=el=>{el.style.textTransform="none";const v=el.innerText;el.style.textTransform="";return v};
document.addEventListener("input",e=>{const el=e.target;if(!ED()||!(el.dataset.k||el.dataset.p))return;let v=rd(el);if(!v.trim()){el.innerHTML="";v=""}
  if(el.dataset.k){SITE[el.dataset.k]=v;$$(`[data-k="${el.dataset.k}"]`).forEach(o=>o!==el&&(o.textContent=v));if(el.dataset.k==="email")$("#mag").href="mailto:"+v}
  else{setP(el.dataset.p,v);if(el.dataset.n!==undefined)el.dataset.n=v}soon()});
// finestra di dialogo
const dlg=$("#dlg"),dB=$("#dB");let onOk=null;
function ask(title,fields,cb){$("#dT").textContent=title;
  dB.innerHTML=fields.map((f,i)=>f.file?`<label>${f.label}<input type="file" accept="${f.accept||"image/*"}" ${f.multi?"multiple":""} data-i="${i}"></label>`
    :f.options?`<label>${f.label}<select data-i="${i}">${f.options.map(o=>`<option ${o===f.value?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`
    :f.color?`<label class="c">${f.label}<input type="color" data-i="${i}" value="${f.value}"></label>`
    :`<label>${f.label}<input type="text" data-i="${i}" value="${esc(f.value||"")}" placeholder="${esc(f.ph||"")}"></label>`).join("");onOk=cb;dlg.classList.add("on")}
$("#dX").onclick=()=>dlg.classList.remove("on");dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.classList.remove("on")});
$("#dOk").onclick=async()=>{const v=[];for(const x of dB.querySelectorAll("input,select"))v[x.dataset.i]=x.type==="file"?[...x.files]:x.value.trim();dlg.classList.remove("on");await onOk(v)};
function shrink(file,mx=1600){return new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);
  c.getContext("2d").drawImage(i,0,0,c.width,c.height);res({url:c.toDataURL("image/jpeg",.8),w:c.width,h:c.height})};i.src=URL.createObjectURL(file)})}
const mv=(arr,i,d)=>{const j=i+d;if(j<0||j>=arr.length)return false;[arr[i],arr[j]]=[arr[j],arr[i]];return true};
// i riferimenti "@Pn" seguono la foto quando si spostano o cancellano le foto
function remapRefs(fn){const fix=v=>{if(typeof v!=="string"||!v.startsWith("@P"))return v;const n=fn(+v.slice(2));return n==null?SITE.photos[+v.slice(2)]?.src||"":"@P"+n};
  SITE.reel.src=fix(SITE.reel.src);SITE.aboutImg=fix(SITE.aboutImg);SITE.videos.forEach(v=>v.src=fix(v.src))}
document.addEventListener("click",async e=>{if(!ED())return;if(e.target.closest("#eb,#dlg,#toast,#lb"))return;
  if(e.target.closest("[contenteditable]")){if(e.target.closest("a"))e.preventDefault();e.stopPropagation();return}
  e.preventDefault();e.stopPropagation();
  const a=e.target.closest("[data-act]");
  if(a){const i=+a.dataset.i,d=+a.dataset.d;switch(a.dataset.act){
    case "mvP":{const j=i+d;if(mv(SITE.photos,i,d))remapRefs(n=>n===i?j:n===j?i:n);break}
    case "delP":{const src=SITE.photos[i].src;remapRefs(n=>n===i?null:n>i?n-1:n);SITE.photos.splice(i,1);break}
    case "catP":{const list=[...new Set(SITE.photos.map(p=>p.c).filter(Boolean))];
      ask("Categoria della foto",[{label:"Scegli",options:list,value:SITE.photos[i].c},{label:"…oppure scrivi una nuova categoria",value:""}],([s,n])=>{SITE.photos[i].c=n||s;done()});return}
    case "addPhotos":ask("Aggiungi foto",[{label:"Scegli una o più foto",file:true,multi:true},{label:"Categoria",value:cat!=="Tutte"?cat:(SITE.photos[0]||{}).c||"Foto"}],async([fs,c])=>{
      toast(`Carico ${fs.length} foto…`);for(const f of fs){const r=await shrink(f);SITE.photos.push({src:r.url,t:f.name.replace(/\.[^.]+$/,"").slice(0,24),c:c||"Foto",w:r.w,h:r.h})}done();toast(`${fs.length} foto aggiunte`)});return
    case "mvV":mv(SITE.videos,i,d);break;
    case "delV":SITE.videos.splice(i,1);break;
    case "addVideo":ask("Nuovo video",[{label:"Titolo",value:""},{label:"Categoria (es. Videoclip)",value:""},{label:"Anno",value:"2026"},{label:"Copertina",file:true},{label:"Link YouTube, Vimeo, Instagram o TikTok",value:"",ph:"https://…"}],async([t,c,y,f,l])=>{
      SITE.videos.push({t:t||"Nuovo video",c:c||"Video",y,src:f&&f[0]?(await shrink(f[0])).url:"",link:l});done()});return
    case "mvS":mv(SITE.services,i,d);break;
    case "delS":SITE.services.splice(i,1);break;
    case "addSvc":SITE.services.push(["Nuovo servizio","Descrizione."]);break;
    case "delF":SITE.facts.splice(i,1);break;
    case "addF":SITE.facts.push(["10","Etichetta"]);break;
    case "delL":SITE.links.splice(i,1);break;
    case "addL":ask("Nuovo link",[{label:"Nome (es. TikTok)",value:""},{label:"Indirizzo",value:"https://"}],([t,h])=>{if(t){SITE.links.push([t,h]);done()}});return
    case "delTag":SITE.tags.splice(i,1);break;
    case "addTag":SITE.tags.push("Nuovo");break}
    done();return}
  const li=e.target.closest("[data-li]");if(li){const i=+li.dataset.li;ask("Link: "+SITE.links[i][0],[{label:"Indirizzo",value:SITE.links[i][1]}],([v])=>{SITE.links[i][1]=v;done()});return}
  const m=e.target.closest("[data-img]");if(m){const p=m.dataset.img,vp=m.dataset.vid,fields=[{label:"Nuova immagine dal computer",file:true}];
    if(vp)fields.push({label:"Link del video (YouTube, Vimeo, Instagram, TikTok)",value:getP(vp)||"",ph:"https://…"});
    ask(vp?"Copertina e video":"Immagine",fields,async([f,l])=>{if(f&&f[0]){const r=await shrink(f[0]);setP(p,r.url);if(p.startsWith("photos.")){const o=SITE.photos[+p.split(".")[1]];o.w=r.w;o.h=r.h}}if(vp&&l!==undefined)setP(vp,l);done()})}
},true);
function done(){renderAll();commit()}
// colori e sito
$("#eCol").onclick=()=>{const C=SITE.colors;ask("Colori",[{label:"Accento (verde acido)",color:1,value:C.acid},{label:"Dettagli (arancio)",color:1,value:C.hot},{label:"Sfondo",color:1,value:C.bg},{label:"Testo",color:1,value:C.ink}],([a,h,b,i])=>{
  SITE.colors={acid:a,hot:h,bg:b,ink:i};document.documentElement.style.setProperty("--bg2",b);done()})};
$("#eMeta").onclick=()=>{const M=SITE.meta;ask("Sito (Google e WhatsApp)",[{label:"Titolo della pagina",value:M.title},{label:"Descrizione",value:M.desc},{label:"Indirizzo del sito (es. https://portfolio-zsn.pages.dev)",value:M.url}],([t,d,u])=>{SITE.meta={title:t,desc:d,url:u};done()})};
// annulla / ripristina
const assets=new Map(),back=[];let hist=[],hi=-1,soonT;
const pack=()=>JSON.stringify(SITE,(k,v)=>{if(typeof v==="string"&&v.startsWith("data:")){if(!assets.has(v)){assets.set(v,back.length);back.push(v)}return "@@"+assets.get(v)}return v});
const unpack=j=>JSON.parse(j,(k,v)=>typeof v==="string"&&v.startsWith("@@")?back[+v.slice(2)]:v);
function commit(){clearTimeout(soonT);const j=pack();if(j===hist[hi])return;hist=hist.slice(0,hi+1);hist.push(j);if(hist.length>80)hist.shift();hi=hist.length-1}
const soon=()=>{clearTimeout(soonT);soonT=setTimeout(commit,600)};
function restore(j){const o=unpack(j);Object.keys(SITE).forEach(k=>delete SITE[k]);Object.assign(SITE,o);renderAll()}
addEventListener("keydown",e=>{if(!ED()||!(e.metaKey||e.ctrlKey)||e.key.toLowerCase()!=="z")return;e.preventDefault();
  if(document.activeElement&&document.activeElement.isContentEditable){commit();document.activeElement.blur()}
  if(e.shiftKey){if(hi<hist.length-1){restore(hist[++hi]);toast("Ripristinato")}}else if(hi>0){restore(hist[--hi]);toast("Annullato")}});
// salva
function buildHTML(site){const A="/*<"+"SITE>*/",B="/*</"+"SITE>*/";let h=PRISTINE;const i=h.indexOf(A),j=h.indexOf(B);
  h=h.slice(0,i+A.length)+"const SITE = "+JSON.stringify(site,null,1)+";"+h.slice(j);
  const M=site.meta||{};h=h.replace(/<title>[\s\S]*?<\/title>/,`<title>${esc(M.title)}</title>`).replace(/<meta name="description"[^>]*>/,`<meta name="description" content="${esc(M.desc)}">`);
  return h}
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.dispatchEvent(new MouseEvent("click",{bubbles:false}));setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},6000)}
$("#eSave").onclick=()=>{download(new Blob([buildHTML(SITE)],{type:"text/html"}),"index.html");toast("Scaricato index.html: tienilo come copia aggiornata")};
// pubblica online: GitHub → Cloudflare Pages
const sha1=async d=>[...new Uint8Array(await crypto.subtle.digest("SHA-1",d))].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,12);
const b64=u=>{const s=atob(u.split(",")[1]),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a};
async function webFiles(){const files=[],map=new Map(),urls=new Set();JSON.stringify(SITE,(k,v)=>{if(typeof v==="string"&&v.startsWith("data:"))urls.add(v);return v});
  for(const v of urls){const mime=v.slice(5,v.indexOf(";")),ext={"jpeg":"jpg","png":"png","webp":"webp","gif":"gif"}[mime.split("/")[1]]||"bin",d=b64(v),nm="img/"+(await sha1(d))+"."+ext;files.push({name:nm,data:d});map.set(v,nm)}
  const site=JSON.parse(JSON.stringify(SITE,(k,v)=>typeof v==="string"&&map.has(v)?map.get(v):v));
  files.unshift({name:"index.html",data:new TextEncoder().encode(buildHTML(site))});return files}
const ghGet=()=>{try{return JSON.parse(localStorage.getItem("pk_gh")||"null")}catch(e){return null}},ghSet=v=>{try{localStorage.setItem("pk_gh",JSON.stringify(v))}catch(e){}};
function ghSetup(then){const g=ghGet()||{};ask("Collega GitHub (una volta sola)",[{label:"Nome utente GitHub",value:g.user||""},{label:"Nome dell'archivio",value:g.repo||"portfolio"},{label:"Chiave di accesso (github_pat_…)",value:g.token||""}],
  ([u,r,t])=>{if(!u||!r||!t){toast("Servono tutti e tre i campi");return}ghSet({user:u,repo:r,token:t,branch:"main"});toast("GitHub collegato");then&&then()})}
async function gh(path,opt={}){const g=ghGet();const r=await fetch(`https://api.github.com/repos/${g.user}/${g.repo}${path}`,Object.assign({},opt,{headers:{"Authorization":"Bearer "+g.token,"Accept":"application/vnd.github+json","Content-Type":"application/json"}}));
  if(!r.ok)throw new Error(r.status+" "+(await r.text()).slice(0,120));return r.json()}
const toB64=d=>{let s="";for(let i=0;i<d.length;i+=32768)s+=String.fromCharCode.apply(null,d.subarray(i,i+32768));return btoa(s)};
let busy=false;
async function publish(){if(busy)return;const g=ghGet();if(!g){ghSetup(publish);return}busy=true;const b=$("#ePub");b.textContent="☁ Pubblico…";
  try{const files=await webFiles();const ref=await gh(`/git/ref/heads/${g.branch}`),base=await gh(`/git/commits/${ref.object.sha}`),tree=await gh(`/git/trees/${base.tree.sha}?recursive=1`),have=new Set(tree.tree.map(t=>t.path));
    const entries=[];let n=0;for(const f of files){if(f.name.startsWith("img/")&&have.has(f.name))continue;toast(`Carico ${++n}: ${f.name}`);
      const bl=await gh("/git/blobs",{method:"POST",body:JSON.stringify({content:toB64(f.data),encoding:"base64"})});entries.push({path:f.name,mode:"100644",type:"blob",sha:bl.sha})}
    const nt=await gh("/git/trees",{method:"POST",body:JSON.stringify({base_tree:base.tree.sha,tree:entries})});
    const c=await gh("/git/commits",{method:"POST",body:JSON.stringify({message:"Aggiornamento "+new Date().toLocaleString("it-IT"),tree:nt.sha,parents:[ref.object.sha]})});
    await gh(`/git/refs/heads/${g.branch}`,{method:"PATCH",body:JSON.stringify({sha:c.sha})});toast("✓ Pubblicato! Online tra circa un minuto")}
  catch(e){const m=String(e.message||e);toast(m.startsWith("401")?"Chiave non valida o scaduta":m.startsWith("404")?"Archivio non trovato":m.startsWith("409")?"Archivio vuoto: crealo con un README":"Errore: "+m);if(/^40[14]/.test(m))setTimeout(()=>ghSetup(),1500)}
  finally{busy=false;b.textContent="☁ Pubblica online"}}
$("#ePub").onclick=publish;$("#ePub").addEventListener("contextmenu",e=>{e.preventDefault();ghSetup()});

</script></body></html>
