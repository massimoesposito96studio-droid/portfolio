<style>
:root{--bg:#0b0d0c;--bg2:color-mix(in srgb,var(--bg) 92%,#fff);--ink:#f1efe8;--mute:#8b8f88;--line:#232825;--acid:#c8ff3e;--hot:#ff5a36}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;width:100%;height:100%;object-fit:cover}
a{color:inherit;text-decoration:none}
::selection{background:var(--acid);color:var(--bg)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.d{font-family:Syne,system-ui,sans-serif;font-weight:800;letter-spacing:-.04em;line-height:.86;text-transform:uppercase}
.acid{color:var(--acid)}
section{position:relative}

/* ===== INTRO: diaframma a 8 lamelle ===== */
#intro{position:fixed;inset:0;z-index:100;pointer-events:none}
#intro svg{position:absolute;inset:0;width:100%;height:100%}
#intro .bl{stroke:rgba(255,255,255,.07);stroke-width:1}
#intro .ring{fill:none;stroke:var(--acid);stroke-width:1.5;opacity:.9}
#intro .cnt{position:absolute;left:0;right:0;bottom:12vh;text-align:center;transition:opacity .5s}
#intro .cnt b{display:block;font:800 clamp(44px,10vw,96px)/1 Syne;color:var(--acid);letter-spacing:-.02em}
#intro .cnt span{color:var(--mute)}
#intro.out .cnt{opacity:0}
/* ===== NAV ===== */
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(16px,3vw,36px);mix-blend-mode:difference}
nav .logo{font:800 18px Syne;letter-spacing:-.02em}
nav .logo i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--acid);margin-left:4px;animation:blink 1.2s steps(1) infinite}
nav .links{display:flex;gap:clamp(14px,2.4vw,30px)}
nav .links a{position:relative;overflow:hidden;display:inline-block;height:1.3em}
nav .links a span{display:block;transition:transform .45s cubic-bezier(.7,0,.2,1)}
nav .links a span+span{position:absolute;top:100%;left:0;color:var(--acid)}
nav .links a:hover span{transform:translateY(-100%)}
@keyframes blink{50%{opacity:0}}

/* ===== HERO ===== */
.hero{height:100svh;min-height:560px;overflow:hidden;display:grid;place-items:center}
.cols{position:absolute;inset:-10% -5%;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;transform:rotate(-8deg) scale(1.15);opacity:.42}
.col{display:flex;flex-direction:column;gap:12px;animation:up var(--d,40s) linear infinite}
.col:nth-child(even){animation-name:down}
.col figure{aspect-ratio:3/4;border-radius:10px;overflow:hidden;flex:none;background:#1a1d1b}
@keyframes up{to{transform:translateY(-50%)}}
@keyframes down{from{transform:translateY(-50%)}to{transform:translateY(0)}}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(11,13,12,.35),rgba(11,13,12,.92) 70%);pointer-events:none}
.ht{position:relative;z-index:2;text-align:center;padding:0 4vw}
.ht .who{display:inline-flex;gap:10px;align-items:center;margin-bottom:3vh;color:var(--acid)}
.ht .who i{width:8px;height:8px;border-radius:50%;background:var(--hot);animation:blink 1s steps(1) infinite}
.name{font-size:clamp(48px,14vw,230px);display:flex;justify-content:center;white-space:nowrap}
.name span{display:inline-block;transform:translateY(110%) rotate(8deg);opacity:0;transition:transform 1.1s cubic-bezier(.2,.9,.2,1),opacity .6s}
.go .name span{transform:none;opacity:1}
.name .s{color:var(--acid)}
.sub{margin-top:3vh;display:flex;gap:clamp(10px,2vw,26px);justify-content:center;flex-wrap:wrap;opacity:0;transform:translateY(14px);transition:1s .9s}
.go .sub{opacity:1;transform:none}
.sub span{border:1px solid var(--line);padding:9px 14px;border-radius:999px;background:rgba(11,13,12,.5);backdrop-filter:blur(6px)}
.hud{position:absolute;inset:auto clamp(16px,3vw,36px) 22px;display:flex;justify-content:space-between;align-items:flex-end;z-index:2;color:var(--mute)}
.cue{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink)}
.cue i{width:1px;height:46px;background:linear-gradient(var(--acid),transparent);animation:cue 1.8s ease-in-out infinite;transform-origin:top}
@keyframes cue{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

/* ===== INTESTAZIONI ===== */
.wrap{padding:clamp(90px,16vh,170px) clamp(16px,4vw,56px)}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:clamp(36px,7vh,70px);flex-wrap:wrap}
.hd h2{font-size:clamp(46px,9vw,150px)}
.hd h2 em{font-style:normal;-webkit-text-stroke:3px var(--ink);color:var(--secbg,var(--bg));paint-order:stroke fill;letter-spacing:-.025em}
#lavori,#servizi{--secbg:var(--bg2)}
.hd p{max-width:34ch;color:var(--mute);line-height:1.5}
.kick{display:block;color:var(--acid);margin-bottom:14px}

/* comparsa delle parole */
.rv{opacity:0;transform:translateY(40px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.wipe{clip-path:inset(100% 0 0 0);transition:clip-path 1.1s cubic-bezier(.7,0,.2,1)}
.wipe.in{clip-path:inset(0)}

/* ===== VIDEO / LAVORI: binario orizzontale ===== */
.work{background:var(--bg2)}
.track{display:flex;gap:clamp(14px,2vw,28px);overflow-x:auto;scroll-snap-type:x mandatory;padding:0 clamp(16px,4vw,56px) 10px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 clamp(270px,38vw,560px);scroll-snap-align:start;cursor:pointer}
.card .m{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#1a1d1b}
.card:hover .cm{--hz:1.07}
.card .tc{position:absolute;left:12px;top:12px;background:rgba(11,13,12,.7);padding:6px 9px;border-radius:6px}
.card .tc b{color:var(--hot);font-weight:500}
.card .pl{position:absolute;right:14px;bottom:14px;width:58px;height:58px;border-radius:50%;background:var(--acid);display:grid;place-items:center;transform:scale(.7) rotate(-90deg);opacity:0;transition:.5s cubic-bezier(.3,1.5,.5,1)}
.card:hover .pl{transform:none;opacity:1}
.card .meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;gap:10px}
.card h3{font:700 clamp(22px,2.4vw,34px)/1 Syne;letter-spacing:-.02em;text-transform:uppercase}
.card .meta .mono{color:var(--mute);white-space:nowrap}
.bar{margin:28px clamp(16px,4vw,56px) 0;height:2px;background:var(--line);position:relative;overflow:hidden;border-radius:2px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:20%;background:var(--acid);transition:transform .2s}
.arrows{display:flex;gap:10px}
.arrows button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:18px;cursor:pointer;transition:.3s}
.arrows button:hover{background:var(--acid);color:var(--bg);border-color:var(--acid)}

/* ===== FOTO ===== */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.filters button{border:1px solid var(--line);background:none;color:var(--ink);padding:10px 16px;border-radius:999px;cursor:pointer;font:500 12px "JetBrains Mono";letter-spacing:.1em;text-transform:uppercase;transition:.3s}
.filters button.on{background:var(--acid);color:var(--bg);border-color:var(--acid)}
.mason{display:block;transition:opacity .22s}
.prow{display:flex;gap:14px;margin-bottom:14px;align-items:flex-start}
.pm{position:relative;overflow:hidden;border-radius:12px;background:#1a1d1b}
.ph{position:relative;min-width:0;cursor:zoom-in}
.ph .cm{--hz:1.15}.ph.in .cm{--hz:1}.ph:hover .cm{--hz:1.05}
.ph .lab{position:absolute;left:0;right:0;bottom:0;border-radius:0 0 12px 12px;overflow:hidden;padding:30px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.7));display:flex;justify-content:space-between;transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.ph:hover .lab{transform:none}
.ph .lab b{font:700 18px Syne;text-transform:uppercase}
.ph.hid{display:none}

/* ===== SHOWREEL ===== */
.reel{padding:0 clamp(16px,4vw,56px) clamp(90px,16vh,170px)}
.screen{position:relative;aspect-ratio:16/9;max-height:84vh;width:100%;border-radius:18px;overflow:hidden;cursor:pointer;background:#000}
.mbox{position:absolute;inset:0;overflow:hidden}
.screen .cm{filter:saturate(.7) brightness(.6);transition:transform 1.5s cubic-bezier(.2,.8,.2,1),filter .8s}
.screen:hover .cm{--hz:1.04;filter:saturate(1) brightness(.75)}
.screen .big{position:absolute;inset:0;display:grid;place-items:center}
.screen .big span{font-size:clamp(60px,14vw,230px);mix-blend-mode:overlay;color:#fff}
.screen .btn{position:absolute;left:50%;top:50%;width:clamp(90px,10vw,140px);aspect-ratio:1;margin:calc(clamp(90px,10vw,140px)/-2);border-radius:50%;background:var(--acid);color:var(--bg);display:grid;place-items:center;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.screen:hover .btn{transform:scale(1.12)}
.screen .btn svg.ring{position:absolute;inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.screen .corner{position:absolute;width:30px;height:30px;border:2px solid var(--acid)}
.screen .c1{left:18px;top:18px;border-right:0;border-bottom:0}.screen .c2{right:18px;top:18px;border-left:0;border-bottom:0}
.screen .c3{left:18px;bottom:18px;border-right:0;border-top:0}.screen .c4{right:18px;bottom:18px;border-left:0;border-top:0}
.screen .rec{position:absolute;left:58px;top:22px;color:#fff}.screen .rec b{color:var(--hot);animation:blink 1s steps(1) infinite}

/* ===== SERVIZI ===== */
.svc{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:60px 1fr 1fr 40px;gap:20px;align-items:center;padding:clamp(20px,3.4vh,34px) 0;border-bottom:1px solid var(--line);position:relative;overflow:hidden;cursor:default}
.row::before{content:"";position:absolute;inset:0;background:var(--acid);transform:translateY(101%);transition:transform .55s cubic-bezier(.7,0,.2,1);z-index:0}
.row:hover::before{transform:none}
.row>*{position:relative;z-index:1;transition:color .3s}
.row:hover>*{color:var(--bg)}
.row h3{font:800 clamp(30px,5vw,78px)/.9 Syne;text-transform:uppercase;letter-spacing:-.03em}
.row p{color:var(--mute);line-height:1.5;max-width:40ch}
.row .ar{font-size:26px;transition:transform .5s}
.row:hover .ar{transform:rotate(-45deg)}

/* ===== ABOUT ===== */
.about{display:grid;grid-template-columns:minmax(220px,420px) 1fr;gap:clamp(30px,6vw,90px);align-items:center}
.pic{position:relative;aspect-ratio:4/5;border-radius:220px 220px 16px 16px;overflow:hidden}
.pic .cm{filter:grayscale(1) contrast(1.1)}
.stamp{position:absolute;right:-18px;top:-18px;width:120px;height:120px;z-index:2}
.stamp svg{animation:spin 18s linear infinite}
.about .q{font:700 clamp(28px,3.6vw,56px)/1.05 Syne;letter-spacing:-.02em;margin-bottom:24px}
.about .q em{font-style:normal;color:var(--acid)}
.about p{color:var(--mute);line-height:1.7;max-width:56ch}
.facts{display:flex;gap:clamp(20px,4vw,50px);margin-top:30px;flex-wrap:wrap}
.facts div{border-left:2px solid var(--acid);padding-left:14px}
.facts b{display:block;font:800 clamp(34px,4vw,56px)/1 Syne}

/* ===== CONTATTI ===== */
.contact{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:16vh 4vw 6vh;overflow:hidden}
.contact h2{font-size:clamp(52px,14vw,230px);white-space:nowrap}
.contact h2 .o{display:inline-block;width:.78em;height:.78em;border-radius:50%;background:var(--acid);vertical-align:-.05em;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.82)}}
.mag{margin-top:6vh;display:inline-flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:20px 30px;border-radius:999px;font:700 clamp(16px,1.8vw,22px) Syne;transition:background .3s;will-change:transform}
.mag:hover{background:var(--acid)}
.mail{margin-top:3vh;color:var(--mute);word-break:break-all}
.soc{display:flex;gap:12px;margin-top:5vh;flex-wrap:wrap;justify-content:center}
.soc a{border:1px solid var(--line);padding:12px 20px;border-radius:999px;transition:.3s}
.soc a:hover{border-color:var(--acid);color:var(--acid)}
footer{display:flex;justify-content:space-between;width:100%;margin-top:12vh;color:var(--mute);flex-wrap:wrap;gap:10px}

/* ===== LIGHTBOX + CURSORE ===== */
#lb{position:fixed;inset:0;z-index:90;background:rgba(6,7,6,.94);display:grid;place-items:center;opacity:0;visibility:hidden;transition:.4s}
#lb.on{opacity:1;visibility:visible}
#lb img{max-width:92vw;max-height:84vh;width:auto;height:auto;border-radius:10px;transform:scale(.94);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#lb.on img{transform:none}
#lb .x{position:absolute;top:18px;right:22px;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:22px;cursor:pointer}
#lb .nv{position:absolute;top:50%;width:52px;height:52px;margin-top:-26px;border-radius:50%;border:0;background:var(--acid);color:var(--bg);font-size:20px;cursor:pointer}
#lb .pv{left:18px}#lb .nx{right:18px}
#lb .cap{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:var(--mute)}
#cur{position:fixed;left:0;top:0;width:12px;height:12px;border-radius:50%;background:var(--acid);z-index:95;pointer-events:none;transform:translate(-50%,-50%);transition:width .3s,height .3s;display:grid;place-items:center;color:var(--bg);font:500 10px "JetBrains Mono";letter-spacing:.1em;mix-blend-mode:difference}
#cur.big{width:80px;height:80px;mix-blend-mode:normal}
@media(hover:none){#cur{display:none}}
#prog{position:fixed;left:0;top:0;height:2px;width:100%;background:var(--acid);transform-origin:0 0;transform:scaleX(0);z-index:60}

@media(max-width:760px){
  nav .links a:not(.k){display:none}

  .stamp{right:8px;top:8px;width:84px;height:84px}

}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.wipe{opacity:1;transform:none;clip-path:none}}

/* barra stile del singolo elemento */

/* ===== EDITOR ===== */
.ph0{width:100%;height:100%;background:linear-gradient(135deg,#1d221f,#2c332e)}

#eb{position:fixed;right:16px;bottom:16px;z-index:120;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#eb[hidden]{display:none}
#eb button{border:0;padding:12px 16px;border-radius:999px;cursor:pointer;font:600 13px Inter;background:var(--ink);color:var(--bg);box-shadow:0 6px 20px rgba(0,0,0,.4)}
#eb .s{display:none}body.editing #eb .s{display:inline-block}
#eb .p{background:var(--acid)}#eb .g{background:#19b36b;color:#fff}
#dlg{position:fixed;inset:0;z-index:130;background:rgba(0,0,0,.6);display:none;place-items:center;font-family:Inter}
#dlg.on{display:grid}
#dlg .dp{background:#f1efe8;color:#111;border-radius:16px;padding:22px;width:min(92vw,440px);display:flex;flex-direction:column;gap:12px;border-top:6px solid var(--acid)}
#dlg h4{font:800 22px Syne;text-transform:uppercase}
#dlg label{display:block;font-size:13px;color:#555}
#dlg label.c{display:flex;justify-content:space-between;align-items:center}
#dlg input[type=text],#dlg select{width:100%;padding:10px;border:1px solid #bbb;border-radius:8px;margin-top:4px;font-size:14px;background:#fff}
#dlg input[type=file]{margin-top:6px;width:100%}
#dlg .dr{display:flex;justify-content:flex-end;gap:8px}#dlg .dr button{border:0;padding:10px 16px;border-radius:999px;font-weight:600;cursor:pointer;background:#ddd}
#dlg .dr .p{background:var(--acid)}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;z-index:140;font:500 13px Inter;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
#lb .vbox{display:none;width:min(92vw,1200px);aspect-ratio:16/9;max-height:84vh}
#lb.vid .vbox{display:block}#lb.vid img,#lb.vid .nv{display:none}
#lb .vbox iframe{width:100%;height:100%;border:0;border-radius:10px}
.sub span{display:inline-flex;align-items:center}.sub b{font-weight:400}
.facts div{position:relative}

/* inquadratura */
.cm{display:block;width:100%;height:100%;object-fit:cover;object-position:var(--ox,50%) var(--oy,50%);transform:scale(calc(var(--z,1) * var(--hz,1)));transform-origin:var(--ox,50%) var(--oy,50%);transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.card.v{flex-basis:clamp(170px,22vw,320px)}
@media(max-width:760px){.card.v{flex-basis:52vw}.prow{gap:8px;margin-bottom:8px}.tl button{width:28px;height:28px;font-size:12px}}
/* header */
nav[data-style=light]{mix-blend-mode:normal;background:var(--ink);color:var(--bg)}
nav[data-style=dark]{mix-blend-mode:normal;background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line)}
nav[data-style=accent]{mix-blend-mode:normal;background:var(--acid);color:var(--bg)}
nav[data-style=accent] .links a span+span,nav[data-style=light] .links a span+span{color:var(--hot)}
nav[data-size=s] .links{font-size:11px}nav[data-size=l] .links{font-size:14px}nav[data-size=l] .logo{font-size:22px}
@media(min-width:761px){nav[data-align=center] .links{position:absolute;left:50%;transform:translateX(-50%)}nav[data-align=left] .links{margin-right:auto;margin-left:36px}}
nav .cta{border:1.5px solid currentColor;border-radius:999px;padding:7px 14px;height:auto!important}
.logo img{display:block}
.mag.off{display:none}body.editing .mag.off{display:inline-flex;opacity:.35}
.mag .hb{margin-left:4px}
.ft{display:inline-flex;gap:2px}
.x1.mv{background:var(--ink)!important;color:var(--bg)!important}
/* categorie */
.chip{display:inline-flex;gap:3px}.ce{display:none!important}
body.editing .ce{display:inline-block!important;border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:8px 11px;cursor:pointer}
body.editing .ce.add{border-color:var(--acid);color:var(--acid)}
/* finestra video */
#lb.vert .vbox{aspect-ratio:9/16;width:auto;height:84vh}
#lb .vbox video{width:100%;height:100%;object-fit:contain;background:#000;border-radius:10px}
/* pannelli e inquadratura */
#pan,#crop{position:fixed;inset:0;z-index:135;background:rgba(0,0,0,.6);display:none;place-items:center;font-family:Inter}
#pan.on,#crop.on{display:grid}
#pan .pp,#crop .pp{background:#f1efe8;color:#111;border-radius:16px;padding:22px;width:min(94vw,500px);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px;border-top:6px solid var(--acid)}
#pan h4,#crop h4{font:800 22px Syne;text-transform:uppercase}
#pan label{display:block;font-size:13px;color:#555}#pan label.c{display:flex;justify-content:space-between;align-items:center;gap:10px}
#pan input[type=text],#pan select{width:100%;padding:9px;border:1px solid #bbb;border-radius:8px;margin-top:4px;font-size:14px;background:#fff}
#pan label.c select,#pan label.c input[type=text]{width:55%;margin:0}
#pan small{color:#888}#pan .n{font-size:13px;color:#555}
#pan .r{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;background:#fff;padding:8px;border-radius:10px}
#pan .r b{font-size:12px}#pan .r.off{opacity:.45}
#pan .r button{width:36px;height:36px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer}
#pan .w{border:1px solid #111;background:none;padding:10px;border-radius:999px;cursor:pointer;font-weight:600}
#pan .pv{width:100%;aspect-ratio:1.91;object-fit:cover;border-radius:8px}#pan .pv.sq{width:56px;height:56px;aspect-ratio:1}
#pan input[type=color]{width:56px;height:34px;border:0;background:none;cursor:pointer}
#pan .dr,#crop .dr{display:flex;justify-content:flex-end;gap:8px}#pan .dr button,#crop .dr button{border:0;padding:10px 16px;border-radius:999px;font-weight:600;cursor:pointer;background:#ddd}
#pan .dr .p,#crop .dr .p{background:var(--acid)}
#cBox{position:relative;width:100%;max-height:58vh;overflow:hidden;border-radius:10px;cursor:grab;touch-action:none;background:#000;margin:auto}
#cBox:active{cursor:grabbing}#cImg{pointer-events:none}
.zl{display:flex;gap:10px;align-items:center;font-size:13px;color:#555}.zl input{flex:1;accent-color:var(--hot)}

(function(){/* diaframma: 8 lamelle che ruotano attorno al foro e si aprono */

  const size=()=>{W=innerWidth;H=innerHeight;cx=W/2;cy=H/2;R=Math.hypot(W,H);svg.setAttribute("viewBox",`0 0 ${W} ${H}`)};size();addEventListener("resize",size);

  function draw(r,rot,ring){let h="";const pts=[];for(let i=0;i<N;i++){const a=rot+i*2*Math.PI/N;pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}

        far=[p[0]+Math.cos(t)*R*1.4,p[1]+Math.sin(t)*R*1.4],a2=rot+(i+1)*2*Math.PI/N,t2=a2+Math.PI/2+.62,far2=[q[0]+Math.cos(t2)*R*1.4,q[1]+Math.sin(t2)*R*1.4];

    :`<label>${f.label}<input type="text" data-i="${i}" value="${esc(f.value||"")}" placeholder="${esc(f.ph||"")}"></label>`).join("");onOk=cb;dlg.classList.add("on")}

function shrink(file,mx=1920){return new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);
  c.getContext("2d").drawImage(i,0,0,c.width,c.height);res({url:c.toDataURL("image/jpeg",.8),w:c.width,h:c.height})};i.src=URL.createObjectURL(file)})}
const readURL=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
async function loadMedia(f){if(f.type.startsWith("video")){if(f.size>15e6){toast(`"${f.name}" è troppo pesante (max 15 MB)`);return null}if(f.size>6e6)toast(`"${f.name}" è pesante: il sito sarà più lento`);return {url:await readURL(f),video:true}}return await shrink(f)}
const mv=(arr,i,d)=>{const j=i+d;if(j<0||j>=arr.length)return false;[arr[i],arr[j]]=[arr[j],arr[i]];return true};
function remapRefs(fn){const fix=o=>{const v=o.src;if(typeof v!=="string"||!v.startsWith("@P"))return;const n=fn(+v.slice(2));o.src=n==null?SITE.photos[+v.slice(2)]?.src||"":"@P"+n};fix(SITE.reel);fix(SITE.about);SITE.videos.forEach(fix)}
document.addEventListener("click",async e=>{if(!ED())return;if(e.target.closest("#eb,#dlg,#toast,#lb,#pan,#crop,#sty"))return;
  if(e.target.closest("[contenteditable]")){if(e.target.closest("a"))e.preventDefault();e.stopPropagation();return}
  if(e.target.closest("#filters [data-c]:not([data-act])"))return;
  e.preventDefault();e.stopPropagation();
  const a=e.target.closest("[data-act]");
  if(a){const i=+a.dataset.i,d=+a.dataset.d,P=SITE.photos;switch(a.dataset.act){
    case "mvP":{const j=i+d;if(mv(P,i,d))remapRefs(n=>n===i?j:n===j?i:n);break}
    case "delP":remapRefs(n=>n===i?null:n>i?n-1:n);P.splice(i,1);break;
    case "oriP":P[i].o=oriOf(P[i])==="v"?"h":"v";Object.assign(P[i],{z:1,x:50,y:50});toast(P[i].o==="v"?"Verticale":"Orizzontale");break;

    case "catP":ask("Categoria della foto",[{label:"Scegli",options:catsList(true),value:P[i].c},{label:"…oppure scrivi una nuova",value:""}],([s,n])=>{P[i].c=n||s;if(n&&!SITE.cats.includes(n))SITE.cats.push(n);done()});return
    case "addCat":ask("Nuova categoria",[{label:"Nome",value:""}],([n])=>{if(n&&!SITE.cats.includes(n))SITE.cats.push(n);done()});return
    case "renCat":{const old=a.dataset.c;ask("Rinomina categoria",[{label:"Nuovo nome",value:old}],([n])=>{if(!n||n===old)return;SITE.cats=(SITE.cats||[]).map(c=>c===old?n:c);if(!SITE.cats.includes(n))SITE.cats.push(n);P.forEach(p=>{if(p.c===old)p.c=n});if(cat===old)cat=n;done()});return}
    case "delCat":{const c=a.dataset.c;SITE.cats=(SITE.cats||[]).filter(x=>x!==c);P.forEach(p=>{if(p.c===c)p.c=""});cat="Tutte";toast(`Categoria "${c}" eliminata`);break}
    case "addPhotos":ask("Aggiungi foto",[{label:"Scegli una o più foto",file:true,multi:true},{label:"Categoria",options:catsList(true).length?catsList(true):["Foto"],value:cat!=="Tutte"?cat:""}],async([fs,c])=>{
      toast(`Carico ${fs.length} foto…`);for(const f of fs){const r=await shrink(f);P.push({src:r.url,t:f.name.replace(/\.[^.]+$/,"").slice(0,24),c:c||"Foto",w:r.w,h:r.h})}done();toast(`${fs.length} foto aggiunte`)});return
    case "mvV":mv(SITE.videos,i,d);break;

    case "oriV":{const v=SITE.videos[i];v.o=v.o==="v"?"h":"v";break}
    case "addVideo":ask("Nuovo video",[{label:"Titolo",value:""},{label:"Categoria (es. Videoclip)",value:""},{label:"Anno",value:"2026"},{label:"Copertina: foto o breve clip MP4",file:true,accept:"image/*,video/*"},{label:"Link YouTube, Vimeo, Instagram o TikTok",value:"",ph:"https://…"}],async([t,c,y,f,l])=>{
      const m=f&&f[0]?await loadMedia(f[0]):null;SITE.videos.push({t:t||"Nuovo video",c:c||"Video",y,src:m?m.url:"",link:l,r:m&&m.w?m.w/m.h:undefined});done()});return
    case "crop":openCrop(a.dataset.path);return
    case "mvS":mv(SITE.services,i,d);break;
    case "delS":SITE.services.splice(i,1);break;
    case "addSvc":SITE.services.push(["Nuovo servizio","Descrizione.",["Etichetta"]]);break;
    case "delSt":SITE.services[i][2].splice(+a.dataset.j,1);break;
    case "addSt":(SITE.services[i][2]=SITE.services[i][2]||[]).push("Nuova");break;
    case "mvF":mv(SITE.facts,i,d);break;
    case "delF":SITE.facts.splice(i,1);break;

    case "mvL":mv(SITE.links,i,d);break;
    case "delL":SITE.links.splice(i,1);break;
    case "addL":ask("Nuovo link",[{label:"Nome (es. TikTok)",value:""},{label:"Indirizzo",value:"https://"}],([t,h])=>{if(t){SITE.links.push([t,h]);done()}});return
    case "delTag":SITE.tags.splice(i,1);break;
    case "addTag":SITE.tags.push("Nuovo");break;
    case "togBtn":SITE.showBtn=SITE.showBtn===false;toast(SITE.showBtn?"Pulsante visibile":"Pulsante nascosto sul sito");break}
    done();return}
  const sv=e.target.closest("[data-svg]");if(sv){const k=sv.dataset.svg;ask(k==="ring"?"Scritta che ruota sullo showreel":"Scritta del timbro",[{label:"Testo (ripeti le parole per riempire il cerchio)",value:SITE[k]}],([v])=>{SITE[k]=v;done()});return}
  if(e.target.closest("#clock")){ask("Città accanto all'orario",[{label:"Città (vuoto = nascondi)",value:SITE.city}],([v])=>{SITE.city=v;$("#clock").style.display=v?"":"none";done()});return}
  if(e.target.closest("#navl")){openPanel("s");return}
  if(e.target.closest("#logo")){openPanel("h");return}
  const li=e.target.closest("[data-li]");if(li){const i=+li.dataset.li;ask("Link: "+SITE.links[i][0],[{label:"Indirizzo",value:SITE.links[i][1]}],([v])=>{SITE.links[i][1]=v;done()});return}
  const m=e.target.closest("[data-img]");if(m){const p=m.dataset.img,vp=m.dataset.vid,base=p.replace(/\.src$/,""),obj=getP(base),photo=p.startsWith("photos."),
      fields=[{label:photo?"Nuova foto dal computer":"Nuova immagine o breve clip MP4",file:true,accept:photo?"image/*":"image/*,video/*"}];
    if(vp)fields.push({label:"Link del video (YouTube, Vimeo, Instagram, TikTok)",value:getP(vp)||"",ph:"https://…"});
    ask(vp?"Copertina e video":"Immagine",fields,async([f,l])=>{if(f&&f[0]){const r=await loadMedia(f[0]);if(r){obj.src=r.url;Object.assign(obj,{z:1,x:50,y:50});if(r.w){obj.r=r.w/r.h;if(photo){obj.w=r.w;obj.h=r.h;obj.o=r.w/r.h>1.05?"h":"v"}}}}if(vp&&l!==undefined)setP(vp,l);done()})}
},true);

/* barra stile del singolo elemento */
const sty=$("#sty");
function hideSty(){const sty=$("#sty");sty.classList.remove("on");if(selEl)selEl.classList.remove("styled-sel");selEl=null}
function showSty(el){if(selEl&&selEl!==el)selEl.classList.remove("styled-sel");selEl=el;selKey=keyOf(el);el.classList.add("styled-sel");const st=(SITE.styles||{})[selKey]||{};
  $("#styV").textContent=Math.round((st.s||1)*100)+"%";$("#styF").value=st.ff||"";
  const cs=getComputedStyle(el),col=el.matches(".hd h2 em")?cs.webkitTextStrokeColor:cs.color,m=col.match(/\d+/g)||[0,0,0];$("#styC").value=st.c||"#"+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,"0")).join("");
  sty.classList.add("on");const r=el.getBoundingClientRect(),h=sty.offsetHeight,w=sty.offsetWidth;sty.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left))+"px";sty.style.top=(r.top>h+16?r.top-h-10:Math.min(innerHeight-h-8,r.bottom+10))+"px"}
document.addEventListener("focusin",e=>{if(ED()&&e.target.isContentEditable&&(e.target.dataset.k||e.target.dataset.p))showSty(e.target)});
addEventListener("scroll",()=>{if(selEl&&sty.classList.contains("on"))showSty(selEl)},{passive:true});
document.addEventListener("pointerdown",e=>{if(sty.contains(e.target)||(selEl&&selEl.contains(e.target)))return;if(!e.target.closest("[contenteditable]"))hideSty()});
function setSt(f){SITE.styles=SITE.styles||{};const st=SITE.styles[selKey]=Object.assign({},SITE.styles[selKey]);f(st);if(!Object.keys(st).length)delete SITE.styles[selKey];styleAll();showSty(selEl);commit()}
sty.addEventListener("mousedown",e=>{if(e.target.tagName==="BUTTON"||e.target.closest("button"))e.preventDefault()});
sty.addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(!b||!selEl)return;const k=b.dataset.s;
  if(k==="+"||k==="-")setSt(st=>{st.s=Math.max(.3,Math.min(4,Math.round(((st.s||1)+(k==="+"?.1:-.1))*10)/10));if(st.s===1)delete st.s});
  if(k==="b")setSt(st=>{const cur=parseInt(getComputedStyle(selEl).fontWeight)>=600;st.b=!cur});
  if(k==="i")setSt(st=>{st.i=getComputedStyle(selEl).fontStyle!=="italic"});
  if(k==="u")setSt(st=>{st.u=getComputedStyle(selEl).textTransform!=="uppercase"});
  if(k==="r")setSt(st=>Object.keys(st).forEach(x=>delete st[x]))});
$("#styF").onchange=e=>setSt(st=>{if(e.target.value)st.ff=e.target.value;else delete st.ff});
$("#styC").oninput=e=>{if(!selEl)return;SITE.styles=SITE.styles||{};const st=SITE.styles[selKey]=Object.assign({},SITE.styles[selKey],{c:e.target.value});styleAll();soon()};

const cEl=$("#crop"),cBox=$("#cBox"),cImg=$("#cImg"),cZ=$("#cZ");let C=null;

function openCrop(path){const o=getP(path),s=SRC(o.src);if(!s){toast("Prima carica un'immagine");return}if(isVid(s)){toast("L'inquadratura funziona sulle foto");return}
  const box=path.startsWith("photos.")?(oriOf(o)==="v"?"4/5":"3/2"):path==="reel"?(innerWidth<760?"4/5":"16/9"):path==="about"?"4/5":(o.o==="v"?"4/5":"16/10");
  C={o,z:+o.z||1,x:o.x??50,y:o.y??50};cBox.style.aspectRatio=box;cImg.src=s;cZ.value=C.z;cEl.classList.add("on");drawCrop()}

function sel(k,v,opts){return `<select data-f="${k}">${opts.map(([a,b])=>`<option value="${a}" ${a===v?"selected":""}>${b}</option>`).join("")}</select>`}

    <label>Indirizzo del sito${txt("meta.url",M.url,"https://portfolio-zsn.pages.dev")}<small>Serve perché l'immagine di anteprima compaia su WhatsApp.</small></label>
    <label>Immagine di anteprima (ritagliata 1200×630)<input type="file" accept="image/*" data-file="og"></label>${M.og?`<img src="${M.og}" class="pv">`:""}

    <label>Codice GoatCounter (statistiche gratuite)${txt("meta.goat",M.goat,"es. pharmakos")}<small>Crea un account su goatcounter.com e scrivi qui il codice.</small></label>`}}

const fit=(file,w,h,type)=>new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=w;c.height=h;const s=Math.max(w/i.width,h/i.height);c.getContext("2d").drawImage(i,(w-i.width*s)/2,(h-i.height*s)/2,i.width*s,i.height*s);r(c.toDataURL(type,.85))};i.src=URL.createObjectURL(file)});
pB.addEventListener("input",e=>{const f=e.target.dataset.f;if(!f||e.target.type==="file")return;const v=e.target.type==="checkbox"?e.target.checked:e.target.type==="range"?+e.target.value:e.target.value;
  if(f==="snum")SITE.snum=v;else setP(f,v);applyLayout();soon()});

    if(t.dataset.file==="og")SITE.meta.og=await fit(f,1200,630,"image/jpeg");if(t.dataset.file==="fav")SITE.meta.favicon=await fit(f,192,192,"image/png");if(t.dataset.file==="logo")SITE.header.logoImg=(await shrink(f,600)).url.replace("image/jpeg","image/jpeg");
    applyLayout();panRender();commit();return}
  if(t.tagName==="SELECT"||t.type==="checkbox"){commit()}});
pB.addEventListener("click",e=>{const so=e.target.closest("[data-so]");if(so){mv(SITE.order,+so.dataset.so,+so.dataset.d);applyLayout();panRender();commit();return}
  const sh=e.target.closest("[data-sh]");if(sh){const id=sh.dataset.sh;SITE.hidden=SITE.hidden.includes(id)?SITE.hidden.filter(x=>x!==id):[...SITE.hidden,id];applyLayout();panRender();commit();return}
  const x=e.target.closest("[data-x]");if(x){if(x.dataset.x==="colreset")SITE.colors={...DEFCOL};if(x.dataset.x==="nologo")SITE.header.logoImg="";applyLayout();panRender();commit()}});

/* annulla / ripristina */
const assets=new Map(),back=[];let hist=[],hi=-1,soonT;
const pack=()=>JSON.stringify(SITE,(k,v)=>{if(typeof v==="string"&&v.startsWith("data:")){if(!assets.has(v)){assets.set(v,back.length);back.push(v)}return "@@"+assets.get(v)}return v});
const unpack=j=>JSON.parse(j,(k,v)=>typeof v==="string"&&v.startsWith("@@")?back[+v.slice(2)]:v);
function commit(){clearTimeout(soonT);const j=pack();if(j===hist[hi])return;hist=hist.slice(0,hi+1);hist.push(j);if(hist.length>100)hist.shift();hi=hist.length-1}
const soon=()=>{clearTimeout(soonT);soonT=setTimeout(commit,600)};
function restore(j){const o=unpack(j);Object.keys(SITE).forEach(k=>delete SITE[k]);Object.assign(SITE,o);renderAll();if(pan.classList.contains("on"))panRender()}
addEventListener("keydown",e=>{if(!ED()||!(e.metaKey||e.ctrlKey)||e.key.toLowerCase()!=="z")return;e.preventDefault();
  if(document.activeElement&&document.activeElement.isContentEditable){commit();document.activeElement.blur()}
  if(e.shiftKey){if(hi<hist.length-1){restore(hist[++hi]);toast("Ripristinato")}else toast("Niente da ripristinare")}else if(hi>0){restore(hist[--hi]);toast("Annullato")}else toast("Niente da annullare")});

/* salva, esporta, pubblica */
function headMeta(site,og,ico){const M=site.meta||{},base=(M.url||"").replace(/\/$/,""),ogU=og&&!og.startsWith("data:")?(base?base+"/"+og:og):"";
  return `<meta property="og:type" content="website"><meta property="og:title" content="${esc(M.title)}"><meta property="og:description" content="${esc(M.desc)}">`+(ogU?`<meta property="og:image" content="${esc(ogU)}"><meta name="twitter:card" content="summary_large_image">`:"")+(M.url?`<meta property="og:url" content="${esc(M.url)}">`:"")+(ico?`<link rel="icon" href="${esc(ico)}">`:"")}
function buildHTML(site,meta,fontCSS){const A="/*<"+"SITE>*/",B="/*</"+"SITE>*/";let h=PRISTINE;const i=h.indexOf(A),j=h.indexOf(B);
  h=h.slice(0,i+A.length)+"const SITE = "+JSON.stringify(site,null,1)+";"+h.slice(j);const M=site.meta||{};
  h=h.replace(/<title>[\s\S]*?<\/title>/,`<title>${esc(M.title)}</title>`).replace(/<meta name="description"[^>]*>/,`<meta name="description" content="${esc(M.desc)}">`).replace(/<!--META-->[\s\S]*?<!--\/META-->/,`<!--META-->${meta}<!--/META-->`);
  if(fontCSS)h=h.replace(/]*>\s*/g,"").replace(/<link href="https:\/\/fonts\.googleapis\.com[^>]*>/,`<style>${fontCSS}</style>`);return h}
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.dispatchEvent(new MouseEvent("click",{bubbles:false}));setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},6000)}
$("#eSave").onclick=()=>{download(new Blob([buildHTML(SITE,headMeta(SITE,"",SITE.meta.favicon),"")],{type:"text/html"}),"index.html");toast("Scaricato index.html: è il tuo file master aggiornato")};
const sha1=async d=>[...new Uint8Array(await crypto.subtle.digest("SHA-1",d))].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,12);
const b64=u=>{const s=atob(u.split(",")[1]),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a};
async function fontsLocal(files){try{const link=document.querySelector('link[href*="fonts.googleapis.com/css"]');if(!link)return"";let css=await (await fetch(link.href)).text();
    css=css.split(/(?=\/\*)/).filter(b=>/\/\* (latin|latin-ext) \*\//.test(b)).join("\n");let n=0;
    for(const u of [...new Set(css.match(/https:\/\/fonts\.gstatic\.com[^)]+/g)||[])]){const d=new Uint8Array(await (await fetch(u)).arrayBuffer()),nm=`fonts/f${++n}.woff2`;files.push({name:nm,data:d});css=css.split(u).join(nm)}return css}
  catch(e){toast("Caratteri non incorporati (serve internet): restano quelli di Google");return""}}
async function webFiles(){const files=[],map=new Map(),urls=new Set();
  JSON.stringify(SITE,(k,v)=>{if(typeof v==="string"&&v.startsWith("data:")&&!["og","favicon"].includes(k))urls.add(v);return v});
  for(const v of urls){const mime=v.slice(5,v.indexOf(";")),ext={"jpeg":"jpg","png":"png","webp":"webp","gif":"gif","mp4":"mp4","quicktime":"mov","webm":"webm"}[mime.split("/")[1]]||"bin",d=b64(v);
    const nm=(mime.startsWith("video")?"video/":"img/")+(await sha1(d))+"."+ext;files.push({name:nm,data:d});map.set(v,nm)}
  const site=JSON.parse(JSON.stringify(SITE,(k,v)=>typeof v==="string"&&map.has(v)?map.get(v):v)),M=SITE.meta;let og=M.og||"",ico=M.favicon||"";
  if(og.startsWith("data:")){files.push({name:"anteprima.jpg",data:b64(og)});og="anteprima.jpg"}
  if(ico.startsWith("data:")){files.push({name:"favicon.png",data:b64(ico)});ico="favicon.png"}
  site.meta=Object.assign({},site.meta,{og,favicon:ico});const fc=await fontsLocal(files);
  files.unshift({name:"index.html",data:new TextEncoder().encode(buildHTML(site,headMeta(site,og,ico),fc))});return files}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return d=>{let c=0xFFFFFFFF;for(let i=0;i<d.length;i++)c=t[(c^d[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}})();
function makeZip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  for(const f of files){const name=enc.encode(f.name),crc=CRC(f.data),h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,f.data.length,true);h.setUint32(22,f.data.length,true);h.setUint16(26,name.length,true);parts.push(h,name,f.data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,f.data.length,true);c.setUint32(24,f.data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);cd.push(c,name);off+=30+name.length+f.data.length}
  const cs=cd.reduce((t,p)=>t+p.byteLength,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,e],{type:"application/zip"})}
$("#eWeb").onclick=async()=>{toast("Preparo la cartella per il web…");const f=await webFiles();download(makeZip(f),"sito-web.zip");toast(`Pronto: sito-web.zip (${f.length} file)`)};
const ghGet=()=>{try{return JSON.parse(localStorage.getItem("pk_gh")||"null")}catch(e){return null}},ghSet=v=>{try{localStorage.setItem("pk_gh",JSON.stringify(v))}catch(e){}};
function ghSetup(then){const g=ghGet()||{};ask("Collega GitHub (una volta sola)",[{label:"Nome utente GitHub",value:g.user||""},{label:"Nome dell'archivio",value:g.repo||"portfolio"},{label:"Chiave di accesso (github_pat_…)",value:g.token||""}],
  ([u,r,t])=>{if(!u||!r||!t){toast("Servono tutti e tre i campi");return}ghSet({user:u,repo:r,token:t,branch:"main"});toast("GitHub collegato");then&&then()})}
async function gh(path,opt={}){const g=ghGet();const r=await fetch(`https://api.github.com/repos/${g.user}/${g.repo}${path}`,Object.assign({},opt,{headers:{"Authorization":"Bearer "+g.token,"Accept":"application/vnd.github+json","Content-Type":"application/json"}}));
  if(!r.ok)throw new Error(r.status+" "+(await r.text()).slice(0,120));return r.json()}
const toB64=d=>{let s="";for(let i=0;i<d.length;i+=32768)s+=String.fromCharCode.apply(null,d.subarray(i,i+32768));return btoa(s)};
let busy=false;
async function publish(){if(busy)return;const g=ghGet();if(!g){ghSetup(publish);return}busy=true;const b=$("#ePub");b.textContent="☁ Pubblico…";
  try{toast("Preparo i file…");const files=await webFiles();const ref=await gh(`/git/ref/heads/${g.branch}`),base=await gh(`/git/commits/${ref.object.sha}`),tree=await gh(`/git/trees/${base.tree.sha}?recursive=1`),have=new Set(tree.tree.map(t=>t.path));
    const entries=[];let n=0;for(const f of files){if(/^(img|video|fonts)\//.test(f.name)&&have.has(f.name))continue;toast(`Carico ${++n}: ${f.name}`);
      const bl=await gh("/git/blobs",{method:"POST",body:JSON.stringify({content:toB64(f.data),encoding:"base64"})});entries.push({path:f.name,mode:"100644",type:"blob",sha:bl.sha})}
    const nt=await gh("/git/trees",{method:"POST",body:JSON.stringify({base_tree:base.tree.sha,tree:entries})});
    const c=await gh("/git/commits",{method:"POST",body:JSON.stringify({message:"Aggiornamento "+new Date().toLocaleString("it-IT"),tree:nt.sha,parents:[ref.object.sha]})});
    await gh(`/git/refs/heads/${g.branch}`,{method:"PATCH",body:JSON.stringify({sha:c.sha})});toast("✓ Pubblicato! Online tra circa un minuto")}
  catch(e){const m=String(e.message||e);toast(m.startsWith("401")?"Chiave non valida o scaduta":m.startsWith("404")?"Archivio non trovato":m.startsWith("409")?"Archivio vuoto: crealo con un README":"Errore: "+m);if(/^40[14]/.test(m))setTimeout(()=>ghSetup(),1500)}
  finally{busy=false;b.textContent="☁ Pubblica online"}}
$("#ePub").onclick=publish;$("#ePub").addEventListener("contextmenu",e=>{e.preventDefault();ghSetup()});

</script></body></html>
